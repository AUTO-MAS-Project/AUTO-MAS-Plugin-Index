[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-plugin-index"
version = "0.1.0"
description = "Generate and publish the AUTO-MAS plugin catalog"
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=3", "packaging>=24", "urllib3>=2.2"]

[project.scripts]
plugin-index = "plugin_index.collect:main"
plugin-index-publish = "plugin_index.publish:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
